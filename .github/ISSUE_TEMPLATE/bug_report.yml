name: Bug report
description: Something didn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste server credentials or bearer tokens** — check any command output you copy in here for them first.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came back.
      placeholder: |
        $ npx @booyaka/mcp-vet .
        Error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcp-vet version
      description: Output of `npx @booyaka/mcp-vet --version`
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node version and OS
      description: Output of `node --version`, plus your OS.
      placeholder: v22.18.0 on Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: Which server, and scan or probe
      description: For a public server, a link. For a private one, the transport and roughly how many tools it exposes.
