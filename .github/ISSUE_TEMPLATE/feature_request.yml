name: Feature request
description: Suggest something mcp-vet should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Reads server source and, for `probe`, starts the server you name and speaks MCP to it. It does not send anything to a third party.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
