name: Release

# Publishes @booyaka/mcp-vet to npm when a v* tag is pushed, authenticating by
# OIDC (trusted publishing) rather than a long-lived token. Provenance is
# generated automatically on that path, which is the point: bypass-2FA tokens
# lose direct publish around January 2027, and a token in CI is the credential
# an account takeover reuses.
#
# id-token: write is the whole mechanism. Without it there is no OIDC token to
# exchange, and the permission is never granted by default.
#
# Deliberately no NODE_AUTH_TOKEN. A token alongside the id-token grant makes
# the path ambiguous, npm prefers the token and silently skips the OIDC
# exchange, and `npm-script-lens publish` grades that UNKNOWN rather than
# TRUSTED.
#
# The npmjs.com side must name this file: Booyaka101 / mcp-vet / release.yml.
# Renaming this file breaks publishing until that entry matches.
#
# setup-node is pinned to v7 on purpose. Up to v6 it answers registry-url: by
# writing a dummy _authToken into .npmrc, which makes npm skip the OIDC
# exchange entirely. The npm trusted-publishers docs still show v6.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # node-version was '20', below the 22.14.0 floor trusted publishing
      # requires, so the OIDC exchange could not have worked here at all.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 22
      # still bundles npm 10, so the runner's default is below the floor.
      - name: Meet the trusted-publishing version floor
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      # No dependency cache in the job that publishes: restoring a shared cache
      # into it is how the TanStack compromise moved, a workflow that never
      # published poisoning a cache the release job then restored.
      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@booyaka/mcp-vet@$VERSION" version >/dev/null 2>&1; then
            echo "@booyaka/mcp-vet@$VERSION is already on the registry, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --access public
            echo "Published @booyaka/mcp-vet@$VERSION with provenance." >> "$GITHUB_STEP_SUMMARY"
          fi
